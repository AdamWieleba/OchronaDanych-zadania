
server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /materialy/ {
    }

    location /wewnetrzne/ {
        deny all;
    }

    location /panel/ {
        auth_basic "Laboratorium 5";
        auth_basic_user_file /auth/uzytkownicy;
    }
}

